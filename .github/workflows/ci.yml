name: CI/CD

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  # CD: solo en push a main y únicamente si el CI anterior pasó en verde.
  deploy:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
    concurrency:
      group: deploy-adminpanel
      cancel-in-progress: false
    steps:
      # Nodo efímero en la tailnet, con la etiqueta tag:ci (solo puede llegar al servidor por SSH)
      - uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
      - name: Desplegar en el servidor
        run: tailscale ssh deploy@archlinux "sudo /usr/local/sbin/deploy-adminpanel ${{ github.sha }}"
      - name: Verificar el sitio
        run: curl --fail --silent --show-error --retry 5 --retry-delay 5 https://admin.srne0.dev/ > /dev/null
